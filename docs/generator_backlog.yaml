# Generator backlog — the authenticity loop's queue (charter: CLAUDE.md).
#
# The referent the charter names ("every miss feeds the generator backlog") and that
# did not exist until now. A finding tracked by nobody silently regresses; this is
# where it is tracked between sessions.
#
# Two kinds of item live here:
#   finding    — a wild break or filed bug to GRADUATE into a synthetic injection
#                family + a deterministic Tier-1/2 oracle (pay tokens once, monitor
#                forever). Drained by /evolve-testdata; scaffolded by
#                calibration/graduate_finding.py (Phase 2).
#   capability — an eval capability to PREP for, usually unlocked by engine work
#                (linked via blocked_on). Recorded so the prep is deliberate.
#
# Every item is scoped to a (vertical, dataset) pairing. Finance is the only shipped
# vertical today, but eval is no longer finance-only in its MODEL.

items:
  - id: CAP-vertical-dataset-match
    kind: capability
    title: Prep for vertical-dataset match (verticals induced from data)
    status: queued
    blocked_on: [DAT-738, DAT-855]   # frame induction; ontology-graph -> recipes/verticals
    vertical: "*"                    # the point: vertical stops being a finance constant
    summary: >
      Tier-A testdata is finance-only and each wild corpus's vertical is hand-authored
      (scripts/frame_wild_vertical.py: VERTICALS = {"rel-f1": MOTORSPORT}). DAT-855
      strand 2 (frame induction, ex-DAT-725 P13 / DAT-738) will INDUCE a vertical from
      a dataset; per the DAT-845 ruling it must acquire validations, cycles, AND
      metrics -- not just concepts (the engine's nothing_declared terminal state is an
      INVALID end state, never valid). DAT-855 strand 3 extends the ontology graph to
      extraction-recipe substrates (recipe = DAT-414 typed-materialization DDL),
      cross-source and cross-table. DAT-725's own note -- "widening follows from the
      eval project" -- is eval holding that slot.
    eval_contract_when_unlocked:
      - "Record each corpus's (vertical, dataset) pairing explicitly, not hardcoded."
      - "Grade an engine-induced vertical against dataset ground truth -- concepts AND validations + cycles + metrics acquired (the DAT-845 invariant), not concepts alone. Synthetic Tier-A holds that full truth; wild is structural-only."
      - "Grade the extraction recipes -- do they materialize the typed tables the dataset declares?"
    prep_now_no_engine_gate:
      - "Phase-2 Finding schema carries `vertical` + `dataset` (never finance-assumed)."
      - "Centralise the dataset->vertical mapping so it is a tracked pairing, not a constant baked into finance code paths."
    do_not_build_yet: >
      Varying the vertical or the recipes. DAT-855 is Not Started, /refine pending, and
      LAST in the lead-locked stabilisation program
      (DAT-853 -> DAT-725 finish -> DAT-671 -> DAT-855). Prep the seams; do not fill them.

  # Finding-graduation entries land here as investigations file them. Shape:
  # - id: FIND-<slug>
  #   kind: finding
  #   title: <one line>
  #   status: queued              # queued | graduated | declined
  #   source: rel-f1 (wild) | detection-v1 | DAT-<n>
  #   vertical: finance
  #   dataset: detection-v1
  #   detector_id: <id>
  #   named_statistic: <KS | orphan-rate | Cramer's V | ...>
  #   evidence: <numbers + the read that shows it>
  #   repro: <calibration/unit/…::test_x | wild stage/run steps>
  #   graduated_to: <the permanent Tier-1/2 oracle nodeid, once done>

  # --- Collected 2026-07-22 from the fire-scoreboard's first pass (Phase 3). Batched
  #     for ONE confirming Tier-3 run "once the dust settles" (Philipp) — each names the
  #     run + hypothesis before the spend, per the token-budget rule. NOT filed as tickets
  #     yet: a suspect with no reproducing run is a rumor (charter).

  - id: HAZARD-vertical-nothing-declared
    kind: finding
    title: A vertical declaring no validations/cycles/metrics makes the operating-model lane vacuously green
    status: queued
    source: rel-f1 (wild) — scripts/frame_wild_vertical.py declares concepts only
    vertical: "*"
    dataset: rel-f1
    detector_id: cross_table_consistency
    named_statistic: declaration-coverage
    evidence: >
      On rel-f1 cross_table_consistency is MUTE (0 entropy rows) — it scores EXECUTED
      validations (DAT-432/L7), and the hand-framed motorsport vertical declares none.
      The OM detectors (cross_table_consistency, business_cycles, metrics) all go silent
      with nothing declared, and silence currently reads as a clean pass.
      "Not declaring validations/cycles/metrics is an easy way to make everything pass"
      (Philipp 2026-07-22). The mechanism is confirmed + reproducible; the engine's
      culpability is the open question below.
    engine_question: >
      Per the DAT-845 ruling an induced vertical's nothing_declared is an INVALID end
      state — the engine is meant to REQUIRE validations + cycles + metrics, not just
      concepts. Does the engine actually block/flag a nothing-declared vertical, or let it
      reach a ready/green state? Passes green = engine finding (file DAT); eval's frame
      merely under-declares = eval/testdata gap. Linked to CAP-vertical-dataset-match.
    proposed_oracle: >
      Cheap deterministic check to build once the dust settles: a run whose vertical
      declared 0 validations AND 0 cycles AND 0 metrics has a VACUOUS OM axis — flag it,
      never count it as a pass. Read the declared/executed counts off the completed run
      (OM tables) the way scoreboard.py reads entropy rows.
    repro: "uv run python -m calibration.scoreboard rel-f1 → cross_table_consistency MUTE; data/rel-f1/metadata_truth.yaml + frame_wild_vertical MOTORSPORT declare no validations"

  - id: FIND-type-fidelity-never-fires
    kind: finding
    title: type_fidelity scores 0.0 on every measured column across all persisted runs
    status: queued
    source: fire-scoreboard (rel-f1 + detection-v1 + clean)
    vertical: finance
    dataset: detection-typing-v1
    detector_id: type_fidelity
    named_statistic: fire-rate
    evidence: >
      NEVER-FIRED on all three persisted runs (55 measured / 0 fired on detection-v1 + clean,
      67/0 on rel-f1; max score 0.0 everywhere). SUSPECT, not filable: detection-v1 injects
      NOTHING for type_fidelity (checked entropy_map), so its silence there proves nothing.
    confirm_run: >
      Run detection-typing-v1 (real type injections) and read its scoreboard. Hypothesis:
      type_fidelity scores 0.0 even on the injected columns = a real MISS (file DAT +
      graduate to a Tier-1 oracle). If it fires there = detector is fine, the silence was
      uninjected columns (decline this item). test_detector_recall already asserts it in
      slice, so a confirmed miss should ALSO show as a red recall oracle.
    ground_truth_instrument: >
      LANDED (free, Phase 4): test_type_fidelity_recorded.py measures the injection's
      numeric-nonconformance rate — clean journal_lines.debit 0.0 vs detection-typing-v1
      0.135 (the corrupt_types 0.15 ratio). So the confirm_run is now pure comparison:
      engine type_fidelity score vs a KNOWN 13.5% type-violation ground truth. A 0.0
      engine score against a measured 0.135 violation IS the filable miss.
    repro: "PENDING confirm_run — instrument ready; not filable until detection-typing-v1 reproduces the engine miss"

  - id: FIND-temporal-entropy-never-fires
    kind: finding
    title: temporal_entropy scores 0.0 on every measured column across all persisted runs
    status: queued
    source: fire-scoreboard (rel-f1 + detection-v1 + clean)
    vertical: finance
    dataset: detection-stockflow-v1
    detector_id: temporal_entropy
    named_statistic: fire-rate
    evidence: >
      NEVER-FIRED on all three persisted runs (9 measured / 0 fired; max 0.0). SUSPECT, not
      filable: none of the persisted runs inject a temporal signal temporal_entropy targets.
    confirm_run: >
      Run a strategy that injects the temporal signal temporal_entropy scores (a stockflow /
      temporal strategy) and read its scoreboard. Hypothesis: 0.0 even where injected = real
      MISS. If it fires = fine, silence was uninjected columns (decline). Batch with the
      type_fidelity run above — one Tier-3 pass covers both.
    repro: "PENDING confirm_run — not filable until a temporal-injection run reproduces the miss"

  # --- Phase-4 note (2026-07-22, CORRECTED): temporal_behavior IS deterministic-groundable.
  #     An earlier draft here claimed it was LLM-only — wrong. Stock/flow is decided by a
  #     data-grounded STRUCTURAL reconciliation (Philipp: "stock flow is not an llm decision"),
  #     and that reconciliation is a free arithmetic net like derived_value's. Built + landed.
  - id: NET-temporal-behavior-structural
    kind: capability
    title: temporal_behavior free net — stock reconciliation break rate (landed)
    status: graduated
    vertical: finance
    dataset: detection-stockflow-events-v1
    detector_id: temporal_behavior
    graduated_to: calibration/unit/test_temporal_behavior_recorded.py
    summary: >
      Stock/flow is NOT an LLM decision: the authority is the data-grounded
      structural_reconciliation witness (DAT-491). A genuine STOCK's per-period delta
      (level[t] − level[t−1]) equals the sum of its backing movement events in that
      (series, period) cell (opening + Σ events = closing); a broken stock does not. That
      identity is deterministic — a free net like derived_value / cross_table_consistency.
      The `llm_claim` witness is one vote in the pool; the trajectory-shape classifier was
      CUT (DAT-459) and the ontology_prior dropped (DAT-657), but the STRUCTURAL identity
      is what actually decides it, so it grounds cheaply.
    evidence: >
      detection-stockflow-events-v1 (measure_probes ⋈ probe_events on series_id, seed
      20260611): reconciling stocks (opening_reserve, ending_headcount, debt_level,
      outstanding_inventory) break on 0.0 of non-opening cells (residual exactly 0.00);
      broken stocks (outstanding_payables, payables_balance, opening_receivables) break on
      0.60–0.87 (residual 121–196). Separation is the full break_ratio.
    still_e2e: >
      The llm_claim witness's recall (does the LLM's stock/flow claim match true_behavior,
      esp. the ambiguous conflicting-cue stratum where the name lies) is still a Tier-3
      measurement — grade it in the batched confirming run. But the detector's core signal
      is now covered free by the structural net above.
    engine_witness_graded_free: >
      UPGRADED (test_temporal_behavior_witness.py): the ENGINE's own classifier
      (dataraum.analysis.lineage.reconcile — pure arithmetic, no DB/LLM, ported FROM an
      eval probe) is now called AS A LIBRARY on the fixture. Reconciling stocks →
      CUMULATIVE, match_rate 1.0, all entities fire; broken stocks → degrade, match_rate
      0.20-0.40 (broken series abstain past FIRE_RESIDUAL_MAX). So the structural-witness
      RECALL — which I wrongly called an e2e-only grade — is a millisecond Tier-2 test
      against the engine's real code. NO pipeline run needed for the structural authority;
      only the LLM-claim/slicing-integration path is irreducibly a run.

  - id: CAP-measured-in-truth
    kind: capability
    title: metadata_truth emits measured_in + cross_unit sections (unit-edge grading)
    status: graduated                # testdata e6f5fe6 (2026-07-22): truth section +
                                     # data-derived cross_unit + declared mix_units
                                     # variant landed. Remaining (with O2 post-pin):
                                     # the mixed-currency variant STRATEGY — deferred
                                     # so its detector_id can name the real drill-gate
                                     # id, not a misleading unit_entropy placeholder.
    blocked_on: [DAT-725]            # only the O2 oracle consumer still waits (DAT-731)
    vertical: finance
    dataset: "*"
    summary: >
      DAT-725/P6 projects og_measured_in (measure column -> unit column, from the
      catalogue-authored unit_source_column; Pint detected_unit stays evidence, never a
      second source) and a per-fact cross-unit drill flag. Grading needs generator
      truth the fixtures already imply: for each Currency-typed measure column, its
      (table, measure_column) -> unit_column pairing, plus cross_unit =
      (distinct unit values > 1) per measure. Clean/medium corpora are single-currency
      (all USD) -> every cross_unit false; the injectors' mixed-currency path flips the
      affected measures true.
    eval_contract_when_unlocked:
      - "measured_in coverage: every measure with a unit column carries the edge (label-invariant, skip-not-vacuous when zero edges)."
      - "cross-unit gate SILENT on single-currency corpora; flagged set == cross_unit truth on a mixed-currency variant."
    prep_now_no_engine_gate:
      - "Emit the measured_in + cross_unit truth sections from the FinanceDataset models (Currency-typed columns are already known to the generator)."

  - id: CAP-roleplay-fk-fixture
    kind: capability
    title: Role-playing FK fixture — two FK roles to one dimension + a second sharing fact
    status: queued
    blocked_on: [DAT-725]            # role-separated conformed identity lands with the epic merge (DAT-788)
    vertical: finance
    dataset: "detection-roleplay-v1"  # ruled Q1 (oracle_backlog_graph_close.md): new Tier-A dataset, never a fold-in; DAT-419 shape rides in the same corpus
    summary: >
      DAT-725/DAT-788 makes fk_role part of the referenced conformed identity
      (separate-until-conformed; the DAT-762 judge merges differently-named same-role
      pairs). No shipped corpus exercises it: nothing role-plays one dimension via two
      FKs. Needed: one fact with two FK roles to one dimension (e.g. bill_to_addr +
      ship_to_addr -> addresses) plus a second fact sharing that dimension. Adjacent:
      the DAT-419 gap (no fixture with two distinct FKs between one table pair) can
      likely graduate with the same shape.
    eval_contract_when_unlocked:
      - "Recall: the witness pairs same-role across facts; never cross-pairs bill_to <-> ship_to."
      - "Precision: no conformed identity fabricated across roles on judge role/abstain (needs_confirmation surfaced)."
      - "Conform path: a differently-named same-role pair the judge conforms DOES pair."
      - "Graph: og_conformed_dimension shows the two roles as distinct axes unless conformed."
    prep_now_no_engine_gate:
      - "Design the fixture shape + its entropy_map truth entries; dataset name DECIDED: detection-roleplay-v1 (Q1 answer in docs/oracle_backlog_graph_close.md)."
