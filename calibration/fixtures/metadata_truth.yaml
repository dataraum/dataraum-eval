# metadata_truth.yaml — agent-layer ground truth for the finance corpus.
#
# The DAT-680 P1 seed ("grade the agents on the existing finance generator"):
# the engine persists agent-authored / derived metadata in `current_*` read views
# that today NO eval asserts (relationships, labels, cycles, validation SQL, the
# metric graph's own SQL, drivers, additivity). This file is the oracle those
# assertions read — the agent-layer analogue of testdata's entropy_map.yaml.
#
# Scope today (DAT-718): the `metric_additivity` section — the first populated
# entry, proving the pattern. Sibling sections are stubs the P1 tasks fill:
# relationships (DAT-684), table/semantic roles + column stock/flow (DAT-685),
# cycles (DAT-686). Hand-authored eval-side for now; DAT-682 moves generation
# into dataraum-testdata's export (the generator already knows FK topology, roles,
# stock/flow, formulas, cycles), at which point this becomes the schema it emits.
#
# Assertion grammar (entropy_eval_architecture.md, agent-metadata contract): a
# named set-statistic / exact-match verdict accuracy over the `current_*` view
# keys — never a new framework.

vertical: finance

# --- metric_additivity (DAT-716 verdict, DAT-718 matrix) ---------------------
# Expected drill additivity verdict per target, checked against
# current_metric_additivity keyed (target_kind, target_key). `categorical_additive`
# / `time_additive` say whether a breakdown by that axis class reconciles to the
# unsliced total; the reason names why it does not (engine vocab: stock / average /
# distinct_count / snapshot_count / min_max / ratio), null when it reconciles.
#
# `determinism` governs the assertion grammar (the anti-Goodhart split):
#   function_symmetry — the verdict is fixed by the aggregate ALONE, independent of
#     any upstream label: AVG, COUNT(DISTINCT), and ratios never reconcile on any
#     axis. HARD-asserted — a mismatch is a real defect in the DAT-716 classifier
#     or its persistence, and no stock/flow label can game it (the
#     no-deterministic-override rule is respected: we assert only what is
#     label-invariant).
#   label_dependent — the verdict ALSO needs a correct stock/flow verdict (the
#     pooled temporal_behavior detector, DAT-685) or event/snapshot grain
#     (DAT-716): SUM(flow)→additive, SUM(stock)→time-stripped, COUNT→additive only
#     on an event fact. Reported as a DIAGNOSTIC, never a hard build-break —
#     re-grading an upstream detector deterministically through this downstream
#     oracle would be Goodhart at the harness level; it is graded in its own P1 lane.
metric_additivity:
  # A metric verdict rolls the metric's extracts up through its DAG; a MEASURE
  # verdict is a standard_field's extract classified directly, folded
  # most-restrictive across every metric that grounds that field. Both kinds are
  # drill targets and both are graded. Inventory-dependent metrics (dio,
  # cash_conversion_cycle) are omitted — this corpus has no inventory accounts, so
  # they never ground (an honest corpus fact, not a matrix gap).
  metrics:
    # ---- function-symmetry (HARD): every ratio + COUNT(DISTINCT) + AVG ----
    active_accounts:
      determinism: function_symmetry
      categorical_additive: false
      time_additive: false
      categorical_reason: distinct_count
      time_reason: distinct_count
      note: "COUNT(DISTINCT account) — the distinct set overlaps across slices."
    average_transaction_value:
      determinism: function_symmetry
      categorical_additive: false
      time_additive: false
      categorical_reason: average
      time_reason: average
      note: "AVG — an average of averages does not reconcile on any axis."
    current_ratio:
      determinism: function_symmetry
      categorical_additive: false
      time_additive: false
      categorical_reason: ratio
      time_reason: ratio
      note: "current_assets / current_liabilities — a ratio; non-additive everywhere."
    gross_margin: &ratio
      determinism: function_symmetry
      categorical_additive: false
      time_additive: false
      categorical_reason: ratio
      time_reason: ratio
      note: "a margin (X / revenue) — a ratio; non-additive on every axis."
    ebitda_margin: *ratio
    net_margin: *ratio
    operating_margin: *ratio
    dso:
      determinism: function_symmetry
      categorical_additive: false
      time_additive: false
      categorical_reason: ratio
      time_reason: ratio
      note: "days-sales-outstanding — a ratio (AR / revenue × days); non-additive."
    dpo:
      determinism: function_symmetry
      categorical_additive: false
      time_additive: false
      categorical_reason: ratio
      time_reason: ratio
      note: "days-payable-outstanding — a ratio (AP / COGS × days); non-additive."
    # ---- label/grain-dependent (soft): COUNT(event) + additive flow roll-ups ----
    transaction_count:
      determinism: label_dependent   # additive only if journal_lines is an EVENT fact (grain)
      categorical_additive: true
      time_additive: true
      categorical_reason: null
      time_reason: null
      note: "COUNT over the journal_lines event fact — additive (needs event-grain)."
    gross_profit: &flow_metric
      determinism: label_dependent   # additive only if its flow operands are flow-labeled
      categorical_additive: true
      time_additive: true
      categorical_reason: null
      time_reason: null
      note: "a sum/difference of flow measures — additive on both axes (needs flow labels)."
    operating_income: *flow_metric
    ebitda: *flow_metric
    net_income: *flow_metric
  measures:
    # ---- function-symmetry (HARD) ----
    account:
      determinism: function_symmetry
      categorical_additive: false
      time_additive: false
      categorical_reason: distinct_count
      time_reason: distinct_count
      note: "The active_accounts extract — COUNT(DISTINCT), grounded by one metric."
    # ---- label-dependent (soft): SUM(flow) additive ----
    revenue: &flow_measure
      determinism: label_dependent   # additive only if the summed amount is labeled flow
      categorical_additive: true
      time_additive: true
      categorical_reason: null
      time_reason: null
      note: "SUM of an income-statement flow — additive on both axes (needs a flow label)."
    cost_of_goods_sold: *flow_measure
    operating_expense: *flow_measure
    depreciation: *flow_measure
    interest: *flow_measure
    tax: *flow_measure
    # ---- label-dependent (soft): SUM(stock) time-stripped (semi-additive) ----
    current_assets: &stock_measure
      determinism: label_dependent   # time-stripped only if the balance is labeled point_in_time
      categorical_additive: true
      time_additive: false
      categorical_reason: null
      time_reason: stock
      note: "SUM of a balance-sheet stock — reconciles across categories, time-stripped."
    current_liabilities: *stock_measure
    accounts_receivable: *stock_measure
    accounts_payable: *stock_measure
    # ---- label-dependent (soft): the shared-field most-restrictive fold ----
    transaction_amount:
      determinism: label_dependent   # soft: the fold's non-additivity needs the AVG metric grounded
      categorical_additive: false
      time_additive: false
      categorical_reason: average
      time_reason: average
      note: >-
        Grounded by BOTH transaction_count (COUNT) and average_transaction_value
        (AVG); the measure verdict is the deduped most-restrictive fold across
        metrics, so AVG wins — proves the shared-field fold end-to-end.

# --- stock/flow ground truth (DAT-685) ---------------------------------------
# The generator-known temporal_behavior per measure column — what
# column_concepts.temporal_behavior SHOULD resolve to. `additive` = a per-period
# flow (sums across time); `point_in_time` = a stock/level (does not sum across
# time). The generator's design is the oracle (finance/models.py): TrialBalance is
# per-period movement (a FLOW); BalanceSheet.ending_balance is a carry-forward
# level (a STOCK). The label_dependent additivity verdicts above compose from
# these, so a stock-cell diagnostic there ultimately traces here. Graded by
# test_agent_labels_e2e.py; a miss is a teach scenario / ticket, never a truth
# patch (DAT-685 hard rule).
stock_flow:
  journal_lines.debit: additive
  journal_lines.credit: additive
  journal_lines.net_amount: additive
  invoices.amount: additive
  payments.amount: additive
  bank_transactions.amount: additive
  trial_balance.debit_balance: additive     # per-period movement — a FLOW (BalanceSheet docstring)
  trial_balance.credit_balance: additive
  balance_sheet.ending_balance: point_in_time   # carry-forward level — a STOCK
  fx_rates.rate: point_in_time                  # a rate/price level — not additive

# Measures expected to reconcile against a finer event fact via the DAT-491
# structural stock/flow witness (read_structural_patterns). Only a rollup fact
# with a finer event fact sharing a slice dimension reconciles: trial_balance ←
# journal_lines (by account_type). The event facts (journal_lines/invoices/
# payments/bank_transactions) are the anchors, and balance_sheet/fx_rates have no
# finer fact — none of those reconcile. DAT-722: BOTH trial_balance measures must
# reconcile; before declines were cut at the source, a coincidental conf=0.05
# debit→payments "FK" stripped debit's only convention, so only credit did.
reconciles_structurally:
  - trial_balance.debit_balance
  - trial_balance.credit_balance

# --- P1 sibling stubs (unpopulated; owning task noted) -----------------------
# DAT-684 — the generator's TRUE FK topology (finance-9), from the testdata models'
# FK docstrings (not from what the LLM accepted — that would be circular). Graded
# for recall (every true FK is judge-confirmed) and precision (no spurious FKs).
# bank_transactions.payment_id is materialized as a DAT-277 surrogate composite
# (`_sk__date__payment_id`), so recall matches surrogate-aware (the true column name
# is a component of the surrogate column). invoices.entry_id and
# bank_transactions.payment_id are nullable FKs.
relationships:
  - {from: journal_lines.entry_id, to: journal_entries.entry_id}
  - {from: journal_lines.account_id, to: chart_of_accounts.account_id}
  - {from: invoices.entry_id, to: journal_entries.entry_id}
  - {from: payments.invoice_id, to: invoices.invoice_id}
  - {from: bank_transactions.account_id, to: chart_of_accounts.account_id}
  - {from: bank_transactions.payment_id, to: payments.payment_id}
  - {from: trial_balance.account_id, to: chart_of_accounts.account_id}
  - {from: balance_sheet.account_id, to: chart_of_accounts.account_id}
  - {from: chart_of_accounts.parent_id, to: chart_of_accounts.account_id}
table_roles: {}       # DAT-685 — fact/dimension role vs current table_entities
semantic_roles: {}    # DAT-685 — semantic_role / business_concept vs current_semantic_annotations
# DAT-686 — business cycles the finance-9 corpus supports (from the finance cycle
# vocabulary + corpus structure), graded vs detected_business_cycles. Cycle detection
# is LLM-inferred, so only the structural-backbone cycles are `required` (a miss is a
# real gap); others are reported soft. Match = canonical_type + key_tables ⊆ tables_involved.
cycles:
  - {canonical_type: journal_entry_cycle, key_tables: [journal_entries, journal_lines], required: true}
  - {canonical_type: accounts_payable, key_tables: [invoices, payments], required: true}
  - {canonical_type: period_close, key_tables: [trial_balance, balance_sheet], required: false}
