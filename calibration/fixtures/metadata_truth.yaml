relationships: []     # DAT-684 — FK topology recall/precision vs current_relationships
table_roles: {}       # DAT-685 — fact/dimension role vs current table_entities
semantic_roles: {}    # DAT-685 — semantic_role / business_concept vs current_semantic_annotations
