# DAT-442 release scorecard — every engine entropy detector, its disposition on the
# entropy-as-disagreement architecture, and its empirical coverage status.
#
# Guarded by test_detector_coverage.py: every detector the engine REGISTERS
# (get_default_registry().get_all_detectors()) must appear here with a valid
# disposition — the "no orphan detector" lock. Disposition is the ARCHITECTURAL
# claim (which layer); coverage is the EMPIRICAL claim (is it proven on the eval).
#
# Two-dimensional scale proof:
#   * architectural — every detector on a principled layer, no boost-Goodhart, coherent
#     loss/readiness composition. DONE + grounded (pooling/models.py, loss.yaml).
#   * empirical — recall + precision per detector through the full Temporal workflow,
#     real reliabilities for pools, teach-closure for teachables. THE OPEN GATE — this
#     file makes the gaps visible. Most cells are `unverified` on purpose.
#
# disposition:
#   pool        — adjudication: a claim + >=2 INDEPENDENT witnesses that can disagree
#                 (pooled into conflict C + ignorance U). The only layer that teaches.
#   scalar      — honest goodness-of-fit / rate / divergence; one grounded signal, no
#                 competing witness. Pooling it would invent fake disagreement (Goodhart).
#   informative — a forensic signal deliberately EXCLUDED from the loss/readiness rollup.
#   candidate   — currently single-witness; becomes a `pool` IFF an independent, data-
#                 grounded 2nd witness exists (entry_criterion). Until then scored scalar.
#
# coverage vocab:
#   recall / precision : proven | baseline | out_of_slice | unverified | n/a
#       proven       = green through the current Temporal workflow on the eval
#       baseline     = recorded pre-Temporal / in-process only, not re-verified through Temporal
#       out_of_slice = the current addSource/beginSession chain does not run its phase yet
#       unverified   = not confirmed this cycle (a gap to close)
#       n/a          = no injection exercises this leg
#   reliabilities : real | placeholder | n/a    (n/a = not a pool)
#   teach_closure : proven | wired | none | n/a (the teach overlay that drives C->eps)
#   in_slice      : true | false | unknown      (does the current Temporal chain run it)

detectors:

  # ---- POOLED (adjudication; the generalized layer) --------------------------
  null_semantics:
    disposition: pool
    witnesses: [quarantine_clustering, type_claim, null_vocabulary]
    coverage:
      recall: proven
      precision: proven
      reliabilities: real          # DAT-450 rig, null_tokens-v2 corpus
      teach_closure: proven        # test_teach_null_value (@llm); the DAT-447 reference
      in_slice: true
    proven_by: "detection-null-v1 (bank_transactions.amount); reliabilities.yaml calibrated:true"

  temporal_behavior:
    disposition: pool
    witnesses: [ontology_prior, llm_claim, structural_reconciliation]
    coverage:
      recall: proven               # e2e 2026-06-10: concept mislabel C 0.000 -> 0.305
      precision: proven            # e2e 2026-06-10: clear-name corpus quiet (C ~ 0)
      reliabilities: real          # 0.762/0.838 measured (clear+ambiguous strata);
                                   # structural_reconciliation 0.85 = probe-derived
                                   # placeholder (needs an events-backed family to rig)
      teach_closure: proven        # e2e 2026-06-10: concept_property teach C 0.305 -> 0.007
      in_slice: true
    note: >-
      DAT-491 PROVEN live (e2e 2026-06-10): the structural_reconciliation witness is
      deterministic arithmetic over the slice substrate (slicing agent names dimensions
      + time axes; temporal slice analysis persists per-period sums; reconciliation
      enumerates signed conventions) — no lineage LLM call. On the canonical corpus
      the recall xfail FLIPPED (XPASS): trial_balance.debit_balance C 0.003 -> 0.363
      (ontology+LLM say stock, data says per_period, convention "debit", match 0.75);
      precision sharpened (ending_balance reconciled cumulative match 1.0, C 0.006).
      Witness fires at session_detect only (exact-run rows), abstains at add_source.

  # ---- LATENT CANDIDATES (pool IFF an independent grounded 2nd witness exists) -
  # entry_criterion = the (b) adversarial gate: the 2nd witness must be DATA-GROUNDED and
  # INDEPENDENT (grounded on data the existing witness does NOT use), not a collinear echo.
  unit_entropy:
    disposition: candidate
    coverage:
      recall: baseline
      precision: baseline
      reliabilities: n/a
      teach_closure: wired         # unit teach (DAT-428) lands the declaration
      in_slice: true
    entry_criterion: >-
      UNVERIFIED. Today single witness (1 - unit_confidence). Pool only if a 2nd witness
      is grounded independently — e.g. an LLM unit hypothesis checked by a reconciliation
      that the declared unit aggregates correctly (DAT-491-class). Must not echo confidence.

  relationship_entropy:
    disposition: scalar              # honest orphan RATE; the pooled discovery claim
                                     # lives in relationship_discovery (lane L2)
    coverage:
      recall: baseline
      precision: baseline
      reliabilities: n/a
      teach_closure: none
      in_slice: true
    note: >-
      Lane L2 (2026-06-10) fixed the live recall=0 bug: teach-materialized
      manual/keeper rows (overlay-only evidence, no RI metrics) shadowed the
      measured candidate/llm rows in load_relationship_for_pair — the orphan
      measurement vanished exactly when a user taught the relationship. Loader
      now backfills measured RI keys from the highest-precedence donor row
      (ri_evidence_source provenance); honest silence preserved when no measured
      row exists.

  relationship_discovery:
    disposition: pool
    witnesses: [value_overlap, llm_judgment, manual_curation, keeper_retention]
    coverage:
      recall: unverified            # lane L2 ordering probe on recorded rows:
                                    # injected-confirmed C=0.147 vs clean-confirmed
                                    # C=0.013 (+0.134); not yet driven through Temporal
      precision: unverified
      reliabilities: placeholder    # rig needs a generative relationship family
                                    # (clean FK / orphan-broken / spurious-overlap)
      teach_closure: none           # the relationship overlay family (add/keep/reject)
                                    # IS the teach surface and re-enters as witnesses;
                                    # closure test pending. Gap: an explicit confirm
                                    # overlay never materializes a row -> human witness
                                    # silent on confirm-taught pairs.
      in_slice: true                # declared on semantic_per_table (session detect)
    note: >-
      Lane L2 (2026-06-10): the discovery-claim pool built on EXISTING rows of the
      directional pair — value_overlap (jc = max(Jaccard, containment) damped by
      statistical_confidence; reads values, never names — the data witness),
      llm_judgment, manual_curation, keeper_retention. Entry criterion satisfied.
      Known structural gap: pure LLM declines never become focal pairs (the engine
      enumerates the defined catalog only), so decline-vs-strong-overlap stays
      unmeasurable until a focal-pair enumeration change + a decline-witness rig.

  # ---- PERMANENT SCALAR (one grounded signal; pooling = Goodhart) -------------
  # derived_value is the zero-cost probe of the LLM-measurable-witness pattern.
  derived_value:
    disposition: pool
    witnesses: [formula_discovery, llm_hypothesis]
    coverage:
      recall: baseline              # obj.score unchanged (honest discovered mismatch
                                    # rate — stays in ORDERING_DETECTORS); the pooled
                                    # formula axis (formula_conflict/_ignorance evidence
                                    # keys -> loss) not yet driven through Temporal
      precision: unverified
      reliabilities: placeholder    # rig needs a formula-divergence family (column
                                    # named for one formula, values following another)
      teach_closure: none           # natural teach: expected_formula overlay (not built)
      in_slice: true
    note: >-
      Lane L3 (2026-06-10): the LLM-hypothesis witness BUILT — the cheap probe of
      "LLM hypothesizes, data grounds". Supply path mirrors temporal_behavior
      (column_annotation prompt field pair -> SemanticAnnotation -> loaders);
      independence preserved by prompt design (the hypothesis states what the NAME
      implies, ungraded by samples); novel hypotheses graded over lake.typed by the
      same match-rate statistic (hallucinated source columns -> abstain). Formula
      identity compared as sqlglot structures with commutative-operand sorting,
      never strings. obj.score stays the scalar mismatch rate; conflict rides in
      evidence keys. No resolve write-back (no consumer field yet).

  benford:
    disposition: informative          # KL surprise; excluded from loss.yaml by design
    coverage: { recall: baseline, precision: baseline, reliabilities: n/a, teach_closure: none, in_slice: true }

  null_ratio:
    disposition: scalar               # completeness rate
    coverage: { recall: baseline, precision: baseline, reliabilities: n/a, teach_closure: none, in_slice: true }

  type_fidelity:
    disposition: scalar               # max(1-parse_success, quarantine) — honest, no boost
    coverage: { recall: baseline, precision: baseline, reliabilities: n/a, teach_closure: none, in_slice: true }

  dimension_coverage:
    disposition: scalar               # mean null rate over dimension columns
    coverage: { recall: unverified, precision: unverified, reliabilities: n/a, teach_closure: none, in_slice: false }

  cross_table_consistency:
    disposition: scalar               # failed-critical categorical 1.0; honest rates below
    coverage: { recall: unverified, precision: unverified, reliabilities: n/a, teach_closure: none, in_slice: true }
    note: >-
      L7 (2026-06-11): wired — operatingModelWorkflow's terminal
      operating_model_detect scores executed validations; failed checks fan out
      to COLUMN-grain objects via the now-persisted columns_used, so bands reach
      the GL columns deliverable metrics flow through (scoreboard baseline was
      0 prevented / 8 wrong-delivered with the GL unbanded). New
      tb_gl_reconciliation spec (critical) is the TB↔GL watcher; DAT-444 remap
      done. Score shape: failed critical = categorical 1.0 (the spec's own
      tolerance decided pass/fail); ERROR = 0.0 + warning (was a clean-leg
      false-alarm machine at 0.5). Recall/precision land with the next batch.

  dimensional_entropy:
    disposition: scalar               # NMI (grounded stat, DAT-472)
    coverage: { recall: unverified, precision: unverified, reliabilities: n/a, teach_closure: none, in_slice: false }

  temporal_entropy:
    disposition: scalar               # binary type/role mismatch
    coverage: { recall: baseline, precision: baseline, reliabilities: n/a, teach_closure: none, in_slice: true }

  business_meaning:
    disposition: scalar               # 1 - LLM naming confidence (single witness by ADR-0009)
    coverage: { recall: baseline, precision: baseline, reliabilities: n/a, teach_closure: none, in_slice: true }

  join_path_determinism:
    disposition: scalar               # join-path count; deterministic
    coverage: { recall: unverified, precision: unverified, reliabilities: n/a, teach_closure: none, in_slice: false }
