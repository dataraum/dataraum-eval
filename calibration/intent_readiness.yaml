# Intent-readiness ground truth — eval-owned, hand-authored from the injections.
#
# The loss table rolls detector scores up to three intent readiness signals
# (query / aggregation / presentation) — risk = clamp01(Σ weight·value), banded
# ready < investigate < blocked (DAT-442; no network). This file is the oracle:
# for each known injection, which intents must it knock off "ready" for the column.
#
# Claim style (non-circular): we assert a FLOOR — "this injection must move this
# intent to at least <min_readiness>" — derived from domain reasoning about what
# the injection breaks, NOT from running the rollup. A 40% null rate in a column
# means that column is not safe to aggregate; the loss rollup must say so.
#
# Schema (per strategy):
#   expectations:
#     - target: "<table>.<column>"   # matches entropy_map target_file/target_column
#       driver: "<detector_id>"      # injected detector; used for slice gating
#       min_readiness:               # floor per intent (omit intents not affected)
#         <intent>: investigate|blocked
#       note: "<why>"
#
# Gating mirrors test_detector_recall.py: an expectation is skipped when its
# driver detector is out of the current addSourceWorkflow slice, known-misaligned,
# or LLM-nondeterministic. As phases get wired, the skips lift automatically.
#
# Precision counterpart: `clean_readiness` (top-level, shared — the clean dataset
# is the same regardless of --strategy) is a captured baseline of clean-data
# readiness, mirroring calibration/clean_baseline.yaml for detector scores. Clean
# financial data is NOT all-ready: it has legitimate metadata gaps (52% nulls in
# cost_center, undeclared units) that the loss rollup correctly surfaces. The
# precision check fails only on a REGRESSION — a clean column reading worse than its
# recorded baseline (a new false alarm) — not on these documented, accurate signals.
# Regenerate after detector/loss changes.

clean_readiness:
  # Captured from the loss rollup on clean data (no injections), DAT-442. Clean
  # financial data legitimately reads non-ready where a real metadata gap exists.
  # null_ratio on a nullable dimension → not aggregation-ready (accurate).
  bank_transactions.payment_id:
    aggregation_intent: investigate
  # cost_center ~52% null → null_ratio aggregation loss (0.7 × ~0.52 ≈ 0.36) →
  # investigate. (Was blocked when slice_variance ALSO scored it 1.0 → noisy-OR;
  # slice_variance was CUT in the DAT-442 reset — a between-slice k-sample test is
  # blind to slice-global injections and saturates on legitimate cross-slice
  # heterogeneity — so aggregation severity now rests on the null rate alone. The
  # expected-vs-problem classifier for heterogeneous dimensions is DAT-184/DAT-473.)
  journal_lines.cost_center:
    aggregation_intent: investigate
  # Rebaselined 2026-06-11 (wave-1 batch): trial_balance debit/credit_balance,
  # invoices.amount and balance_sheet.ending_balance read non-ready on clean —
  # all ACCURATE metadata-gap signals, each closable by a cheap teach: the LLM
  # did not declare TB units this run (unit_entropy 1.0 → unit teach) and
  # temporal_behavior correctly contests named-balance-behaves-flow (C≈0.5, the
  # standing data-true ambiguity → concept_property teach); invoices.amount adds
  # the grounding-variance conflict (accounts_payable point_in_time prior vs the
  # flow claim). None of these columns sit in a deliverable metric's lineage —
  # the clean outcomes scoreboard stays 8/8 right with no warnings.
  balance_sheet.ending_balance:
    aggregation_intent: blocked
    presentation_intent: investigate
  invoices.amount:
    aggregation_intent: blocked
    query_intent: investigate
    presentation_intent: investigate
  trial_balance.credit_balance:
    aggregation_intent: blocked
    presentation_intent: investigate
  trial_balance.debit_balance:
    aggregation_intent: blocked
    presentation_intent: investigate
  # Rebaselined 2026-07-02 (DAT-602 post-#432 gate): the FIXED temporal_behavior
  # (previously mis-wired — it never claimed this column, hence "ready") now pools
  # a single uncorroborated llm_claim "stock" on fx_rates.rate — conflict 0,
  # ignorance 0.811 → aggregation 0.4 × 0.811 ≈ 0.324 → investigate. ACCURATE:
  # an FX rate is a point-in-time ratio; naive aggregation is meaningless.
  # Closable by the concept_property/rebind teach once corroborated.
  fx_rates.rate:
    aggregation_intent: investigate

detection-v1:
  expectations:
    - target: "journal_lines.cost_center"
      driver: "null_ratio"
      min_readiness:
        aggregation_intent: investigate
      note: "40% nulls — null_ratio strongly drives aggregation_safety (0.7)"

    # journal_lines.credit / outlier_rate expectation removed — outlier_rate CUT
    # (DAT-442): absolute IQR can't separate the 5%@10x burst from clean financial
    # heavy tails. See dataraum-eval test_outlier_rate_recorded.py.

    # bank_transactions.amount / benford expectation removed — benford is an
    # INFORMATIVE SIGNAL (DAT-442), not a loss measurement: it drives no intent
    # readiness, so there is no band to floor. Recall stays proven by the ordering
    # grammar in test_detector_recall.

    # business_meaning is LLM-nondeterministic (xfail strict=False, like recall):
    # naming_clarity feeds presentation_intent (0.7), so when detection fires the
    # column should read >= investigate for reporting.
    - target: "invoices.rrFlp_11_zp00"
      driver: "business_meaning"
      min_readiness:
        presentation_intent: investigate
      note: "garbage name — naming_clarity -> presentation_intent; LLM-nondeterministic"
    - target: "invoices.xQ_v7kL"
      driver: "business_meaning"
      min_readiness:
        presentation_intent: investigate
      note: "garbage name — naming_clarity -> presentation_intent; LLM-nondeterministic"

    # --- Below: drivers whose owning phase is not yet in the workflow slice.
    # Documented now so the oracle is complete; skipped until the phase is wired.
    - target: "payments.invoice_id"
      driver: "relationship_entropy"
      grain: relationship
      min_readiness:
        presentation_intent: ready
      note: >-
        20% orphan FKs at RELATIONSHIP grain (the relationship:{from}::{to} target's
        band, indexed per endpoint; the column's own band is blind to relationship
        problems by design — DAT-408/DAT-405). Honest band: orphan_rate 0.20 ×
        placeholder reporting weight 0.75 = 0.15 → ready (< 0.3). Like benford /
        derived_value, no linear loss weight lifts a 0.20 rate to investigate without
        Goodhart; recall is proven by the ordering grammar in test_detector_recall.
        DAT-450 weight calibration / a stronger orphan injection lifts the band.
    - target: "journal_lines.debit"
      driver: "derived_value"
      min_readiness:
        aggregation_intent: ready
      note: >-
        10% formula drift injected on net_amount -> formula_match ->
        aggregation_intent. The correlations dedup prefers the sum form
        (debit = net_amount + credit), so the broken-formula score is
        ATTRIBUTED to debit, not the injected column — same attribution the
        recall test's _find_score handles (see CLAUDE.md derived_value note).
        DAT-442: boost removed -> honest mismatch rate ~0.10 (was 0.71 boosted).
        Like benford above, no linear loss weight lifts a 0.10 mismatch to
        investigate without Goodhart, so the band honestly stays ready (severity
        in the loss table, not a boost). Recall still proven by the ordering
        grammar in test_detector_recall; strengthen the injection (DAT-450) to
        exercise the investigate path — do NOT crank the weight.
    # temporal_drift CUT (DAT-442 reset): distribution drift can't separate a shift
    # from natural volatility on flow columns (clean KS ≈ injected ≈ 0.53). Proven
    # in calibration/unit/test_drift_recorded.py; real drift → DAT-445.
    # cross_table_consistency on invoices.amount: WIRED (L7) and measuring — the
    # gl_invoice_match failure fans out to the column at the honest 0.29 mismatch
    # rate (warning severity → rate, not categorical). 0.29 × placeholder weight
    # 0.8 = 0.23 < the 0.3 band, so the floor honestly stays ready until S2 fits
    # the loss weights against outcomes labels — do NOT crank the weight (same
    # rule as benford above). The TB↔GL leg (critical → categorical 1.0) is the
    # banding path; this one is the rate path.

detection-typing-v1:
  expectations:
    - target: "journal_lines.debit"
      driver: "type_fidelity"
      min_readiness:
        query_intent: ready
      note: >-
        8% type quarantine → type_fidelity 0.08 × placeholder query weight 0.7 = 0.056
        → ready (< 0.3). Honest band post-boost-removal (was 0.585 boosted). Like
        benford / derived_value / relationship_entropy, no linear loss weight lifts an
        8% rate to investigate without Goodhart; recall is proven by the ordering
        grammar in test_detector_recall. DAT-450 weight calibration / a stronger
        quarantine injection lifts the band.
    - target: "payments.date"
      driver: "temporal_entropy"
      min_readiness:
        query_intent: investigate
        presentation_intent: investigate
      note: >
        corrupt dates -> temporal_entropy maps to the time_role node, which feeds
        query_intent (0.5), aggregation_intent (0.4), and presentation_intent (0.4).
        Unparseable dates break time-filtering, time-bucketed aggregation, and
        time-stamped reporting alike.
