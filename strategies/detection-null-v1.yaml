name: detection-null-v1
level: high
description: >
  Null-semantics adjudication calibration (ADR-0009 / DAT-457 / DAT-450). Injects
  the generative null_tokens FAMILY into numeric columns: a recorded seed samples
  sentinel MARKERS (is-null — they cluster) and genuine-but-unparseable DECOYS
  (is-value — they smear). Both fail the numeric cast → quarantine → the
  null_semantics detector adjudicates each rejected token by pooling quarantine /
  type / vocabulary witnesses. Novel markers dissent from the vocabulary witness,
  so conflict fires — the case a null_value teach then closes.

  Generative, not memorized: different seeds vary the surface (markers, decoys,
  rates), the recorded seed reproduces exactly (DAT-450 AC1). Graded by ORDERING
  (injected conflict > clean baseline by a margin), never a point threshold
  (ADR-0009 eval grammar). This same family is the calibration rig that measures
  the shipped witness reliabilities — see scripts/calibrate_reliabilities.py.

# Detector tested: null_semantics (adjudication; ordering/delta grammar, NOT a
# point threshold — see calibration/test_adjudication_recall.py)

injections:
  - injector: inject_null_token_family
    table: journal_lines
    detector_id: null_semantics
    params:
      col: debit
      seed: 20260609
      severity: high

  - injector: inject_null_token_family
    table: bank_transactions
    detector_id: null_semantics
    params:
      col: amount
      seed: 20260824
      severity: high
